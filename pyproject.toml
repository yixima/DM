[project]
name = "dm"
version = "0.1.0"
description = "定期メール配信 + 問い合わせフォーム自動送信システム"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
form = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
dm = "dm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
